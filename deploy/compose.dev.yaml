name: remr-dev

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: remr
      POSTGRES_PASSWORD: remr
      POSTGRES_DB: remr
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U remr -d remr"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
